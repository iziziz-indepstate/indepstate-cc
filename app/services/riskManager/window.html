<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Risk Manager</title>
  <style>
    :root { color-scheme: dark; --bg:#101214; --panel:#171a1f; --line:#2a3038; --text:#e7edf5; --muted:#8f9baa; --red:#ef4444; --green:#22c55e; --amber:#f59e0b; --blue:#38bdf8; }
    * { box-sizing:border-box; }
    body { margin:0; font:13px/1.4 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); background:#12151a; position:sticky; top:0; z-index:2; }
    h1 { margin:0; font-size:16px; font-weight:650; }
    button { border:1px solid var(--line); background:#20252d; color:var(--text); border-radius:6px; padding:6px 10px; cursor:pointer; }
    button:hover { background:#28313b; }
    button.danger { border-color:rgba(239,68,68,.45); color:#fecaca; }
    button.icon { width:30px; height:30px; padding:0; display:inline-grid; place-items:center; }
    main { display:grid; grid-template-columns: 520px 1fr; gap:12px; padding:12px; }
    section { border-top:1px solid var(--line); padding-top:10px; }
    details { border-top:1px solid var(--line); padding-top:10px; }
    summary { cursor:pointer; color:#dbeafe; font-size:13px; font-weight:650; margin-bottom:8px; }
    h2 { margin:0 0 8px; font-size:13px; color:#dbeafe; font-weight:650; }
    label { display:grid; gap:4px; color:var(--muted); margin-bottom:8px; }
    input, textarea { width:100%; border:1px solid var(--line); background:#0f1216; color:var(--text); border-radius:6px; padding:7px 8px; font:12px ui-monospace,SFMono-Regular,Consolas,monospace; }
    input[type="checkbox"] { width:auto; accent-color:var(--blue); }
    textarea { min-height:220px; resize:vertical; }
    table { width:100%; border-collapse:collapse; }
    th, td { border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; vertical-align:top; }
    th { color:var(--muted); font-weight:600; background:#151920; position:sticky; top:47px; }
    .stack { display:grid; gap:12px; }
    .toolbar { display:flex; align-items:center; gap:8px; }
    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
    .inline { display:flex; align-items:center; gap:8px; }
    .inline label { margin:0; display:flex; align-items:center; gap:6px; }
    .row-actions { display:flex; align-items:center; gap:6px; }
    .provider-row { cursor:pointer; }
    .provider-row.selected { background:#1d2630; }
    .provider-row input { min-width:72px; }
    .provider-cell { min-width:150px; }
    .compact-input { max-width:96px; }
    .add-row { display:grid; grid-template-columns: 1.3fr 1fr 1fr auto; gap:8px; align-items:end; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .muted { color:var(--muted); }
    .ok { color:var(--green); }
    .warn { color:var(--amber); }
    .bad { color:var(--red); }
    .pill { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:2px 7px; color:var(--muted); white-space:nowrap; }
    .error { color:#fecaca; min-height:18px; }
  </style>
</head>
<body>
  <header>
    <h1>Risk Manager</h1>
    <div class="toolbar">
      <span id="status" class="muted"></span>
      <button id="refresh">Refresh</button>
      <button id="save">Save</button>
    </div>
  </header>
  <main>
    <div class="stack">
      <section>
        <div class="section-head">
          <h2>Global Settings</h2>
          <label><input id="global-enabled" type="checkbox"> Enabled</label>
        </div>
        <div class="grid2">
          <label>Poll, ms<input id="global-poll" type="number" min="100" step="100"></label>
          <label>Log rows<input id="global-log-limit" type="number" min="1" step="1"></label>
        </div>
        <div id="error" class="error"></div>
      </section>
      <section>
        <div class="section-head">
          <h2>Provider Limits</h2>
          <button id="add-provider" class="icon" title="Add provider">+</button>
        </div>
        <table>
          <thead><tr><th>Provider</th><th>Enabled</th><th>Stop $</th><th>Loss $</th><th></th></tr></thead>
          <tbody id="providers"></tbody>
        </table>
      </section>
      <section>
        <div class="section-head">
          <h2>Symbol Overrides</h2>
          <span id="selected-provider" class="muted"></span>
        </div>
        <table>
          <thead><tr><th>Symbol</th><th>Enabled</th><th>Stop $</th><th>Loss $</th><th></th></tr></thead>
          <tbody id="symbols"></tbody>
        </table>
        <div class="add-row">
          <label>Symbol<input id="new-symbol" placeholder="ADAUSDT.cfd"></label>
          <label>Stop $<input id="new-symbol-stop" type="number" min="0" step="0.01"></label>
          <label>Loss $<input id="new-symbol-loss" type="number" min="0" step="0.01"></label>
          <button id="add-symbol">Add</button>
        </div>
      </section>
      <details>
        <summary>Advanced JSON Settings</summary>
        <label>Config JSON<textarea id="config"></textarea></label>
      </details>
    </div>
    <div class="stack">
      <section>
        <h2>Tracked Risk Items</h2>
        <table>
          <thead><tr><th>Provider</th><th>Item</th><th>Risk</th><th>Status</th><th></th></tr></thead>
          <tbody id="positions"></tbody>
        </table>
      </section>
      <section>
        <h2>Trigger Log</h2>
        <table>
          <thead><tr><th>Time</th><th>Provider</th><th>Item</th><th>Check</th><th>Action</th><th>Result</th></tr></thead>
          <tbody id="logs"></tbody>
        </table>
      </section>
    </div>
  </main>
  <script src="./window.js"></script>
</body>
</html>
